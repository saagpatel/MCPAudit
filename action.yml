name: MCPAudit
description: >-
  Audit locally configured MCP servers for permission, prompt-injection, SSRF,
  lethal-trifecta, shadowing, escalation, and provenance risk. Emits SARIF/JSON
  and can fail the build on a local policy gate.
author: saagpatel
branding:
  icon: shield
  color: purple

inputs:
  version:
    description: >-
      Exact mcp-audits version to install (e.g. "2.0.0"). Defaults to the
      version declared in this Action's pyproject.toml.
    required: false
    default: ""
  wheel:
    description: >-
      Optional local wheel path to install instead of a published package.
      Intended for repository self-audits of the wheel built by the same run.
    required: false
    default: ""
  args:
    description: >-
      Extra arguments for the installed command's grammar, split with shell
      quoting (never evaluated). Expanded check-capable installs use check;
      older installs use scan. Legacy --json PATH and single --clients NAME
      are translated for check with a command notice.
    required: false
    default: ""
  skip-connect:
    description: >-
      Run config-only without spawning or connecting to servers. Strongly
      recommended in CI. Set to "false" only for trusted, network-isolated runs.
    required: false
    default: "true"
  clients:
    description: Comma-separated client filter (e.g. "claude_code,cursor").
    required: false
    default: ""
  config:
    description: >-
      Audit a single explicit MCP config file (implies --config-only). Leave
      empty to audit all discovered configs.
    required: false
    default: ""
  policy:
    description: >-
      Path to a local policy YAML. A failing policy makes this action exit 2
      (after reports are written and SARIF is uploaded).
    required: false
    default: ""
  sarif:
    description: >-
      SARIF 2.1.0 output path. Set to "" to disable SARIF output.
    required: false
    default: "mcp-audit.sarif"
  json:
    description: JSON report output path. Empty disables JSON output.
    required: false
    default: ""
  upload-sarif:
    description: >-
      Upload the SARIF file to GitHub code scanning (requires
      `security-events: write`). Ignored when `sarif` is empty.
    required: false
    default: "true"
  sarif-category:
    description: >-
      Optional GitHub code scanning category for this upload. Use a stable
      value when multiple SARIF producers report on the same commit.
    required: false
    default: "mcp-audit"
  working-directory:
    description: Directory to run the scan from (repo-local configs are discovered relative to it).
    required: false
    default: "."

outputs:
  sarif-file:
    description: Path to the written SARIF report (empty if SARIF was disabled).
    value: ${{ steps.scan.outputs.sarif-file }}
  json-file:
    description: Path to the written JSON report (empty if JSON was disabled).
    value: ${{ steps.scan.outputs.json-file }}
  exit-code:
    description: The mcp-audit exit code (0 clean, 2 policy gate failed).
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14.8"

    - name: Install MCPAudit
      shell: bash
      env:
        MCP_AUDIT_VERSION: ${{ inputs.version }}
        MCP_AUDIT_WHEEL: ${{ inputs.wheel }}
        MCP_AUDIT_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "${MCP_AUDIT_WHEEL}" ]; then
          if [ -n "${MCP_AUDIT_VERSION}" ]; then
            echo "::error::Specify either wheel or version, not both."
            exit 1
          fi
          if [[ "${MCP_AUDIT_WHEEL}" != *.whl || ! -f "${MCP_AUDIT_WHEEL}" || -L "${MCP_AUDIT_WHEEL}" ]]; then
            echo "::error::wheel must be a path to an existing regular .whl file."
            exit 1
          fi
          python -m pip install --upgrade "${MCP_AUDIT_WHEEL}"
        else
          if [ -z "${MCP_AUDIT_VERSION}" ]; then
            MCP_AUDIT_VERSION="$(python -c 'import pathlib, sys, tomllib; print(tomllib.loads((pathlib.Path(sys.argv[1]) / "pyproject.toml").read_text())["project"]["version"])' "${MCP_AUDIT_ACTION_PATH}")"
          fi
          if [[ ! "${MCP_AUDIT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be an exact semantic version in MAJOR.MINOR.PATCH form."
            exit 1
          fi
          python -m pip install --upgrade "mcp-audits==${MCP_AUDIT_VERSION}"
        fi

    - name: Audit MCP servers
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Inputs are passed via env (never interpolated into the script) so
        # crafted input values cannot inject shell commands.
        SKIP_CONNECT: ${{ inputs.skip-connect }}
        CLIENTS: ${{ inputs.clients }}
        CONFIG: ${{ inputs.config }}
        POLICY: ${{ inputs.policy }}
        SARIF: ${{ inputs.sarif }}
        JSON: ${{ inputs.json }}
        EXTRA_ARGS: ${{ inputs.args }}
        MCP_AUDIT_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python "${MCP_AUDIT_ACTION_PATH}/scripts/run_action.py"

    - name: Check for SARIF artifact
      id: sarif-check
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.sarif != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SARIF: ${{ inputs.sarif }}
      run: |
        set -uo pipefail
        if [ -f "${SARIF}" ]; then
          echo "exists=true" >> "${GITHUB_OUTPUT}"
        else
          echo "exists=false" >> "${GITHUB_OUTPUT}"
          echo "::warning title=MCPAudit::SARIF file '${SARIF}' was not produced; skipping upload."
        fi

    - name: Upload SARIF to code scanning
      if: ${{ always() && steps.sarif-check.outputs.exists == 'true' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ${{ inputs.sarif-category }}

    - name: Enforce scan result
      if: ${{ always() }}
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        set -uo pipefail
        # Fail closed: a missing exit code means the scan step never recorded
        # its result (e.g. GITHUB_OUTPUT write failed), so do not green the gate.
        if [ -z "${CODE}" ]; then
          echo "::error title=MCPAudit::mcp-audit recorded no exit code; failing closed."
          exit 1
        fi
        if [ "${CODE}" != "0" ]; then
          echo "::error title=MCPAudit::mcp-audit exited ${CODE} (policy gate failed or scan error)."
          exit "${CODE}"
        fi
        echo "MCPAudit scan passed (exit 0)."
