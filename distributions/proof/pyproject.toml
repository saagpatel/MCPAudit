[project]
name = "mcp-audits-proof"
version = "2.12.0"
description = "MCPAudit proof distribution scaffold"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.3,<9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "mcp_audit_build_backend"
backend-path = ["."]

[tool.uv.build-backend]
module-name = "proof_before_action"
source-include = ["mcp_audit_build_backend.py"]
