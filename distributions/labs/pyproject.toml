[project]
name = "mcp-audits-labs"
version = "2.12.0"
description = "MCPAudit labs distribution scaffold"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp-audits==2.12.0",
]

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "mcp_audit_build_backend"
backend-path = ["."]

[tool.uv.build-backend]
module-name = "mcp_audit_labs"
source-include = ["mcp_audit_build_backend.py"]

[tool.uv.sources]
mcp-audits = { workspace = true }
