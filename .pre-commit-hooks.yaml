# pre-commit hook definitions for MCPAudit.
# Usage in a consuming repo's .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/saagpatel/MCPAudit
#       rev: v3.0.0
#       hooks:
#         - id: mcp-audit
#
# The hook triggers when a repo-local MCP config changes and statically checks
# supported workstation/project configs (never spawns or connects to servers).
# Project discovery is relative to the repo root.
- id: mcp-audit
  name: Audit MCP server configs
  description: >-
    Check discovered MCP server configuration files for permission,
    prompt-injection, and config-health risks. Static; never connects.
  entry: mcp-audit check --include-discovered --inject-check
  language: python
  files: (^|/)(\.mcp\.json|\.vscode/mcp\.json)$
  pass_filenames: false
