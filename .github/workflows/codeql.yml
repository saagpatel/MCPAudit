name: CodeQL

on:
  push:
    branches: ["main", "release/2.x"]
  pull_request:
    branches: ["main", "release/2.x"]
  workflow_dispatch:
  schedule:
    - cron: "24 11 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Name is a required status check in branch protection; it also scans Actions.
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python, actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
