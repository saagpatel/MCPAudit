name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag (for example, v2.5.0)
        required: true
        type: string
      commit:
        description: Exact 40-character commit recorded in the release approval
        required: true
        type: string
      dry_run:
        description: Build and smoke-test without granting publication authority
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  validate-dispatch-ref:
    name: Refuse non-release/2.x workflow definitions
    runs-on: ubuntu-latest
    steps:
      - name: Require workflow dispatch from release/2.x
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$DISPATCH_REF" = "refs/heads/release/2.x"

  build:
    name: Verify and build exact release
    needs: validate-dispatch-ref
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-controls

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          path: release-source

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Read back protected PyPI environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/pypi-2x" \
            --output "$RUNNER_TEMP/pypi-environment.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/pypi-2x/deployment-branch-policies" \
            --output "$RUNNER_TEMP/pypi-branches.json"

      - name: Verify release authorization binding
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: release-source
        run: |
          git fetch --force --tags origin release/2.x
          python ../release-controls/scripts/verify_release.py \
            --release-branch release/2.x \
            --root . \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --environment-json "$RUNNER_TEMP/pypi-environment.json" \
            --branch-policies-json "$RUNNER_TEMP/pypi-branches.json" \
            --require-publishable

      - name: Install locked dependencies
        working-directory: release-source
        run: uv sync --dev --locked

      - name: Prepare Proof Before Action test image
        working-directory: release-source
        run: |
          docker image inspect node:24-slim >/dev/null 2>&1 || docker pull node:24-slim
          docker image inspect --format '{{.Id}}' node:24-slim

      - name: Run release quality gate
        working-directory: release-source
        run: |
          python ../release-controls/scripts/check_advisories.py --lock uv.lock \
            --build-constraints ../release-controls/build-constraints.txt
          uv run pytest
          uv run ruff check
          uv run ruff format --check
          uv run mypy .
          uv lock --check
          git diff --check

      - name: Validate detection corpus
        working-directory: release-source
        run: uv run python tests/validation/validate_patterns.py

      - name: Build wheel and sdist
        working-directory: release-source
        run: uv build --clear --no-create-gitignore

      - name: Verify built distributions
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.sha }}
        working-directory: release-source
        run: |
          mkdir -p "$RUNNER_TEMP/candidate/dist"
          uv run python ../release-controls/scripts/verify_release.py \
            --release-branch release/2.x \
            --root . \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --environment-json "$RUNNER_TEMP/pypi-environment.json" \
            --branch-policies-json "$RUNNER_TEMP/pypi-branches.json" \
            --require-publishable \
            --dist-dir dist \
            --workflow-sha "$WORKFLOW_SHA" \
            --write-manifest "$RUNNER_TEMP/candidate/release-manifest.json"
          sha256sum "$RUNNER_TEMP/candidate/release-manifest.json"
          python -c 'import os; print("workflow_sha=" + os.environ["WORKFLOW_SHA"]); print("source_commit=" + os.environ["RELEASE_COMMIT"])'

      - name: Resolve explicit artifact paths
        id: paths
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          cp "release-source/dist/mcp_audits-$release_version-py3-none-any.whl" "$RUNNER_TEMP/candidate/dist/"
          cp "release-source/dist/mcp_audits-$release_version.tar.gz" "$RUNNER_TEMP/candidate/dist/"
          echo "wheel=$RUNNER_TEMP/candidate/dist/mcp_audits-$release_version-py3-none-any.whl" >> "$GITHUB_OUTPUT"
          echo "sdist=$RUNNER_TEMP/candidate/dist/mcp_audits-$release_version.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload exact candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-audits-${{ inputs.tag }}
          path: |
            ${{ steps.paths.outputs.wheel }}
            ${{ steps.paths.outputs.sdist }}
            ${{ runner.temp }}/candidate/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  consumer-smoke:
    name: Smoke disposable copies without candidate write authority
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted smoke controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Download disposable copies of candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-audits-${{ inputs.tag }}
          path: release/
      - name: Verify before smoke
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python scripts/verify_release.py --publication-check artifacts \
            --release-branch release/2.x \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --workflow-sha "$WORKFLOW_SHA" \
            --dist-dir release/dist --manifest release/release-manifest.json
          cp release/release-manifest.json "$RUNNER_TEMP/approved-manifest.json"
      - name: Smoke-install exact wheel and sdist
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          wheel="release/dist/mcp_audits-$release_version-py3-none-any.whl"
          sdist="release/dist/mcp_audits-$release_version.tar.gz"
          for package in "$wheel" "$sdist"; do
            smoke="$RUNNER_TEMP/install-smoke-$(basename "$package")"
            uv venv "$smoke"
            uv pip install --python "$smoke/bin/python" "$package"
            test "$("$smoke/bin/mcp-audit" --version)" = "mcp-audit, version $release_version"
            test "$("$smoke/bin/mcp-audits" --version)" = "mcp-audit, version $release_version"
            test "$("$smoke/bin/proof-before-action" --version)" = "proof-before-action, version $release_version"
            "$smoke/bin/python" -I scripts/smoke_installed_artifact.py
          done
      - name: Recheck exact file set and digests after smoke
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python scripts/verify_release.py --publication-check artifacts \
            --release-branch release/2.x \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --workflow-sha "$WORKFLOW_SHA" \
            --dist-dir release/dist --manifest "$RUNNER_TEMP/approved-manifest.json"

  publish:
    name: Publish approved artifacts to PyPI
    needs: [build, consumer-smoke]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi-2x
    permissions:
      actions: read
      contents: read
      id-token: write  # OIDC trusted publishing

    steps:
      - name: Checkout trusted publication controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify protected PyPI environment is still enforced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/pypi-2x" \
            --output "$RUNNER_TEMP/pypi-environment.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/pypi-2x/deployment-branch-policies" \
            --output "$RUNNER_TEMP/pypi-branches.json"
          python scripts/verify_release.py --publication-check environment \
            --release-branch release/2.x \
            --environment-json "$RUNNER_TEMP/pypi-environment.json" \
            --branch-policies-json "$RUNNER_TEMP/pypi-branches.json"

      - name: Download exact candidate artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-audits-${{ inputs.tag }}
          path: release/

      - name: Read back artifact hashes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python scripts/verify_release.py --publication-check artifacts \
            --release-branch release/2.x \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --workflow-sha "$WORKFLOW_SHA" \
            --dist-dir release/dist --manifest release/release-manifest.json
          cat release/release-manifest.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist/
          attestations: true
