name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag (for example, v2.5.0)
        required: true
        type: string
      commit:
        description: Exact 40-character commit recorded in the release approval
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-dispatch-ref:
    name: Refuse non-main workflow definitions
    runs-on: ubuntu-latest
    steps:
      - name: Require workflow dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$DISPATCH_REF" = "refs/heads/main"

  build:
    name: Verify and build exact release
    needs: validate-dispatch-ref
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-controls

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          path: release-source

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Read back protected PyPI environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/pypi" \
            --output "$RUNNER_TEMP/pypi-environment.json"

      - name: Verify release authorization binding
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: release-source
        run: |
          git fetch --force --tags origin main
          python ../release-controls/scripts/verify_release.py \
            --root . \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --environment-json "$RUNNER_TEMP/pypi-environment.json" \
            --require-publishable

      - name: Install locked dependencies
        working-directory: release-source
        run: uv sync --dev --locked

      - name: Prepare Proof Before Action test image
        working-directory: release-source
        run: |
          docker image inspect node:24-slim >/dev/null 2>&1 || docker pull node:24-slim
          docker image inspect --format '{{.Id}}' node:24-slim

      - name: Run release quality gate
        working-directory: release-source
        run: |
          uv run pytest
          uv run ruff check
          uv run ruff format --check
          uv run mypy .
          uv lock --check
          git diff --check

      - name: Validate detection corpus
        working-directory: release-source
        run: uv run python tests/validation/validate_patterns.py

      - name: Build wheel and sdist
        working-directory: release-source
        run: uv build --clear

      - name: Verify built distributions
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: release-source
        run: |
          uv run python ../release-controls/scripts/verify_release.py \
            --root . \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --environment-json "$RUNNER_TEMP/pypi-environment.json" \
            --require-publishable \
            --dist-dir dist
          sha256sum dist/* | tee SHA256SUMS

      - name: Smoke-install exact wheel and sdist
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: release-source
        run: |
          release_version="${RELEASE_TAG#v}"
          wheel="$(find dist -maxdepth 1 -type f -name 'mcp_audits-*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -type f -name 'mcp_audits-*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"
          for package in "$wheel" "$sdist"; do
            smoke="$RUNNER_TEMP/install-smoke-$(basename "$package")"
            uv venv "$smoke"
            uv pip install --python "$smoke/bin/python" "$package"
            test "$("$smoke/bin/mcp-audit" --version)" = "mcp-audit, version $release_version"
            test "$("$smoke/bin/mcp-audits" --version)" = "mcp-audit, version $release_version"
            test "$("$smoke/bin/proof-before-action" --version)" = "proof-before-action, version $release_version"
            "$smoke/bin/python" -I scripts/smoke_installed_artifact.py
          done

      - name: Upload exact candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-audits-${{ inputs.tag }}
          path: |
            release-source/dist/*.whl
            release-source/dist/*.tar.gz
            release-source/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved artifacts to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write  # OIDC trusted publishing

    steps:
      - name: Verify protected PyPI environment is still enforced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/pypi" \
            --output "$RUNNER_TEMP/pypi-environment.json"
          jq --exit-status '
            .can_admins_bypass == false
            and any(
              .protection_rules[];
              .type == "required_reviewers"
              and .prevent_self_review == false
              and (.reviewers | length) > 0
            )
          ' "$RUNNER_TEMP/pypi-environment.json"

      - name: Download exact candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-audits-${{ inputs.tag }}
          path: release/

      - name: Read back artifact hashes
        run: |
          cd release
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist/
          attestations: true
