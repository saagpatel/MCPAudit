name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          "$RUNNER_TEMP/actionlint/actionlint"

      - name: Confirm actionlint rejects an unknown cache input
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/actionlint-regression.log"
          if "$RUNNER_TEMP/actionlint/actionlint" tests/fixtures/actionlint/invalid-cache-mode.yml >"$output" 2>&1; then
            echo "actionlint accepted the invalid cache-mode input" >&2
            exit 1
          fi
          grep -F 'input "cache-mode" is not defined' "$output"

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local Markdown links
        run: python3 .github/scripts/check_markdown_links.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.13.0"

      - name: Install dependencies
        run: uv sync --all-packages --locked --dev

      - name: Install PostgreSQL 16 server binaries
        run: sudo apt-get install -y postgresql-16

      - name: Static checks
        run: make lint

      - name: Prepare local observer image
        run: docker pull node:24-slim

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/ research/test_proofos_postgres.py -v --ignore=tests/test_connector.py --cov=mcp_audit --cov=mcp_audit_labs --cov-branch \
            --junitxml="$RUNNER_TEMP/unit-results.xml" 2>&1 | tee "$RUNNER_TEMP/unit-pytest.log"
          grep -Eq '^=+ .* (passed|failed|error|skipped|xfailed|xpassed)(,| )' "$RUNNER_TEMP/unit-pytest.log"
          RESULTS_PATH="$RUNNER_TEMP/unit-results.xml" uv run python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["RESULTS_PATH"]).getroot()
          module = "research.test_proofos_postgres"
          proof_cases = [
              case for case in root.iter("testcase")
              if case.attrib.get("classname", "") == module
              or case.attrib.get("classname", "").startswith(module + ".")
          ]
          if not proof_cases:
              raise SystemExit("ProofOS PostgreSQL test cases missing from pytest results")
          counts = {
              "tests": len(proof_cases),
              "skipped": sum(case.find("skipped") is not None for case in proof_cases),
          }
          if counts["skipped"] != 0:
              raise SystemExit(f"inadmissible ProofOS PostgreSQL result: {counts}")
          print(f"proofos_postgres_guard={counts['tests']}_tests_0_skipped")
          PY

      - name: Integration tests (connector)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/test_connector.py -v --cov=mcp_audit --cov=mcp_audit_labs --cov-append --cov-branch \
            2>&1 | tee "$RUNNER_TEMP/connector-pytest.log"
          grep -Eq '^=+ .* (passed|failed|error|skipped|xfailed|xpassed)(,| )' "$RUNNER_TEMP/connector-pytest.log"

      - name: Named-server stdio smoke
        run: uv run python scripts/smoke_named_server.py --executable "$PWD/.venv/bin/mcp-audit"

      - name: Coverage gate
        run: uv run coverage report --fail-under=85

  install-shape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          version: "0.13.0"

      - name: Build distribution wheels
        shell: bash
        run: |
          set -euo pipefail
          uv build --package mcp-audits --wheel --build-constraints build-constraints.txt --out-dir dist
          uv build --package mcp-audits-labs --wheel --build-constraints build-constraints.txt --out-dir dist
          uv build --package mcp-audits-proof --wheel --build-constraints build-constraints.txt --out-dir dist
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          ls -l dist

      - name: Core-only install
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/core"
          uv venv "$core"
          uv pip install --python "$core/bin/python" --find-links dist "dist/mcp_audits-${VERSION}-py3-none-any.whl"
          uv pip list --python "$core/bin/python"

          status=0
          "$core/bin/mcp-audit" check --config "$PWD/examples/sandbox/fixtures/synthetic-mcp-config.json" \
            --config-only --skip-connect --override-config /dev/null || status=$?
          if [ "$status" -ne 0 ]; then
            echo "core-only check exited $status, expected 0" >&2
            exit 1
          fi

          notice="uv tool install 'mcp-audits[labs]'"
          for command in "lab agent-ui" "safeforge run"; do
            status=0
            # shellcheck disable=SC2086
            "$core/bin/mcp-audit" $command 2>"$RUNNER_TEMP/stderr.log" || status=$?
            cat "$RUNNER_TEMP/stderr.log" >&2
            if [ "$status" -ne 2 ]; then
              echo "core-only '$command' exited $status, expected 2" >&2
              exit 1
            fi
            if ! grep -qF "$notice" "$RUNNER_TEMP/stderr.log"; then
              echo "core-only '$command' did not print the labs install command" >&2
              exit 1
            fi
          done

          if [ -e "$core/bin/proof-before-action" ] || PATH="$core/bin:/usr/bin:/bin" command -v proof-before-action; then
            echo "proof-before-action is on PATH in a core-only install" >&2
            exit 1
          fi

          "$core/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.util

          for distribution in ("mcp-audits-labs", "mcp-audits-proof"):
              try:
                  importlib.metadata.distribution(distribution)
              except importlib.metadata.PackageNotFoundError:
                  continue
              raise SystemExit(f"{distribution} metadata is present in a core-only install")
          for module in ("mcp_audit_labs", "proof_before_action"):
              if importlib.util.find_spec(module) is not None:
                  raise SystemExit(f"{module} is importable in a core-only install")
          PY

      - name: Proof-only install
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof"
          uv venv "$proof"
          uv pip install --python "$proof/bin/python" --find-links dist "dist/mcp_audits_proof-${VERSION}-py3-none-any.whl"
          uv pip list --python "$proof/bin/python"

          status=0
          output="$("$proof/bin/proof-before-action" --version)" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "proof-before-action --version exited $status, expected 0" >&2
            exit 1
          fi
          if [ "$output" != "proof-before-action, version ${VERSION}" ]; then
            echo "unexpected Proof version output: $output" >&2
            exit 1
          fi

          if "$proof/bin/python" -c 'import mcp_audit'; then
            echo "mcp_audit is importable in a Proof-only install" >&2
            exit 1
          fi
          if "$proof/bin/python" -c 'import importlib.metadata as m; m.distribution("mcp-audits")'; then
            echo "mcp-audits metadata is present in a Proof-only install" >&2
            exit 1
          fi
