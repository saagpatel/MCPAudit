name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Install PostgreSQL 16 server binaries
        run: sudo apt-get install -y postgresql-16

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Prepare local observer image
        run: docker pull node:24-slim

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/ -v --ignore=tests/test_connector.py --cov=mcp_audit --cov-branch \
            --junitxml="$RUNNER_TEMP/unit-results.xml" 2>&1 | tee "$RUNNER_TEMP/unit-pytest.log"
          grep -Eq '^=+ .* (passed|failed|error|skipped|xfailed|xpassed)(,| )' "$RUNNER_TEMP/unit-pytest.log"
          RESULTS_PATH="$RUNNER_TEMP/unit-results.xml" uv run python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["RESULTS_PATH"]).getroot()
          module = "tests.test_proofos_postgres"
          proof_cases = [
              case for case in root.iter("testcase")
              if case.attrib.get("classname", "") == module
              or case.attrib.get("classname", "").startswith(module + ".")
          ]
          if not proof_cases:
              raise SystemExit("ProofOS PostgreSQL test cases missing from pytest results")
          counts = {
              "tests": len(proof_cases),
              "skipped": sum(case.find("skipped") is not None for case in proof_cases),
          }
          if counts["skipped"] != 0:
              raise SystemExit(f"inadmissible ProofOS PostgreSQL result: {counts}")
          print(f"proofos_postgres_guard={counts['tests']}_tests_0_skipped")
          PY

      - name: Integration tests (connector)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/test_connector.py -v --cov=mcp_audit --cov-append --cov-branch \
            2>&1 | tee "$RUNNER_TEMP/connector-pytest.log"
          grep -Eq '^=+ .* (passed|failed|error|skipped|xfailed|xpassed)(,| )' "$RUNNER_TEMP/connector-pytest.log"

      - name: Named-server stdio smoke
        run: uv run python scripts/smoke_named_server.py --executable "$PWD/.venv/bin/mcp-audit"

      - name: Coverage gate
        run: uv run coverage report --fail-under=85
