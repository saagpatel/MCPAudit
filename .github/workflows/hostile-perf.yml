name: Hostile server performance

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Cumulative target profile (baseline until the planned fixes land)
        type: choice
        default: baseline
        options: [baseline, p1-9, p3-7, p3-8]

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --dev --locked
      # Session calibration scales time ceilings for this runner; RSS and coverage stay fixed.
      - name: Calibrate runner and run all hostile performance cases
        env:
          PERF_PROFILE: ${{ inputs.profile || 'baseline' }}
        run: >-
          uv run --offline --no-sync pytest tests/test_hostile_perf.py -m perf -q -s
          -p no:cacheprovider --perf-profile="$PERF_PROFILE" --perf-output=build/perf
          --junitxml=build/perf-junit.xml
      - name: Retain measurements even on a regression
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-perf
          path: |
            build/perf/**/metrics.json
            build/perf-junit.xml
          if-no-files-found: error
